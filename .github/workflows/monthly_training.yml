name: Monthly Model Training

on:
  schedule:
    # Ejecutar el primer día de cada mes a las 4:00 AM UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run model training
      run: |
        python -m src.training_model
        
    - name: Commit and push models
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add models/
        git add *.log
        git diff --staged --quiet || git commit -m "Monthly model training - $(date +'%Y-%m-%d')"
        git push
